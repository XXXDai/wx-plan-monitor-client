# 复制为 config.yaml 后修改。config.yaml 已在 .gitignore 中，不会被提交到公开仓库。
server:
  base_url: http://your-server-ip:8000    # 建议上 HTTPS（Caddy/Nginx 反代）
  client_id: wx-pc-1                      # 需与服务端 server.clients 里的 key 一致
  secret: ""                              # 与服务端一致；留空则读环境变量 BARK_CLIENT_SECRET
  timeout: 30
  verify_ssl: true

monitor:
  # 微信 4.1+（如 4.1.8.107）用 wxauto4；微信 3.9.x 用 wxauto；auto = 自动选
  backend: auto                           # auto | wxauto4 | wxauto | mock
  chats:                                  # 要监听的群名，必须与微信窗口里显示的完全一致
    - 套保方案群
  poll_interval: 2                        # 拉取新消息的间隔（秒）
  upload_suffixes:                        # 这些后缀的文件才上传给服务端解析
    - .docx
    - .doc
    - .xlsx
    - .xls
    - .pdf
    - .txt
    - .md
    - .csv
  send_text: true                         # 是否上报文本消息（服务端按"特定人/关键词"判断报警）
  senders_only: []                        # 非空时只上报这些人的文本消息（文件永远上报）
  ignore_self: true                       # 忽略自己发的消息
  save_pic: false                         # 是否让 wxauto 下载图片

runtime:
  db_path: data/outbox.db                 # 本地待发队列（断网不丢消息）
  log_file: data/client.log
  download_dir: data/downloads            # wxauto4 把群文件下载到这里
  batch_size: 20
  send_interval: 3
  max_attempts: 0                         # 0 = 一直重试
  heartbeat_interval: 120
  mock_dir: ""                            # 填目录名则进入模拟模式（非 Windows 调试用）
